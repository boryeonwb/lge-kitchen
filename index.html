<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LG전자 냉장고 운영·정산 대시보드</title>

    <!--
      Untitled Serif / Messina Sans 는 유료 커스텀 서체라 스타일 가이드가 지정한
      대체 서체를 쓴다: 디스플레이 = Source Serif 4, 기능 텍스트 = Inter.
      제목이 대부분 한글이므로 한글 세리프(Noto Serif KR)를 짝지어 둔다 —
      없으면 한글만 시스템 명조로 떨어져 두 줄의 인상이 갈린다.
      네트워크가 막힌 환경에서는 styles.css 의 폴백 스택으로 조용히 내려간다.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Source+Serif+4:opsz,wght@8..60,400&family=Noto+Serif+KR:wght@400&display=swap"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
